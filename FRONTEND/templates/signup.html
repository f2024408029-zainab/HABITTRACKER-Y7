{% extends "base.html" %}
{% block title %}Sign Up · My Life Journal{% endblock %}
{% block content %}
<div class="auth-page" data-theme="ocean">
  <div class="auth-card">
    <h1 class="auth-title">My Life Journal</h1>
    <p class="auth-subtitle">Create your account and start journaling your days.</p>

    <form method="POST" class="auth-form">
      <label>Username</label>
      <input type="text" name="username" required autofocus placeholder="e.g. sara_writes">

      <label>Email</label>
      <input type="email" name="email" required placeholder="you@example.com">

      <label>Password</label>
      <input type="password" name="password" required placeholder="At least 6 characters">

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
