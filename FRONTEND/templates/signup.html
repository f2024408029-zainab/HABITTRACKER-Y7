{% extends "base.html" %}
{% block title %}Sign Up · Smart Habit Tracker{% endblock %}
{% block content %}
<div class="auth-page" data-theme="ocean">
  <div class="auth-card">
    <h1 class="auth-title">🌱 Create Your Account</h1>
    <p class="auth-subtitle">Start tracking your moods, hobbies and habits.</p>

    <form method="POST" class="auth-form">
      <label>Username</label>
      <input type="text" name="username" required autofocus placeholder="e.g. sara_habits">

      <label>Email</label>
      <input type="email" name="email" required placeholder="you@example.com">

      <label>Password</label>
      <input type="password" name="password" required placeholder="At least 6 characters">

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
