{% extends "base.html" %}
{% set active_page = "settings" %}
{% block title %}Settings · Smart Habit Tracker{% endblock %}
{% block content %}
<div class="settings-page">
  <h1 class="page-title">Settings</h1>

  <h2 class="section-heading">Choose a Theme</h2>
  <form method="POST" class="theme-form">
    <div class="theme-grid">
      {% for theme in themes %}
        <label class="theme-swatch-label">
          <input type="radio" name="theme" value="{{ theme }}" {{ 'checked' if user.theme == theme else '' }} onchange="this.form.submit()">
          <span class="theme-swatch" data-theme-preview="{{ theme }}">
            <span class="swatch-dot swatch-1"></span>
            <span class="swatch-dot swatch-2"></span>
            <span class="swatch-dot swatch-3"></span>
          </span>
          <span class="theme-name">{{ theme|capitalize }}</span>
        </label>
      {% endfor %}
    </div>
  </form>

  <h2 class="section-heading">Account</h2>
  <div class="settings-card">
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <a href="{{ url_for('logout') }}" class="btn btn-danger">Log Out</a>
  </div>
</div>
{% endblock %}
